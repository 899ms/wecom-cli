[package]
name = "wecom-cli"
version = "1.1.0"
edition = "2024"

[[bin]]
name = "wecom-cli"
path = "src/main.rs"

[features]
custom-endpoint = ["wecom/custom-endpoint"]

[dependencies]
aes-gcm = "0.11"
anyhow = { workspace = true }
base64 = "0.23"
clap = "4.6"
cliclack = "0.5"
dirs = "6.0.0"
dotenvy = "0.15.7"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { workspace = true }
keyring = "4"
open = "5"
qr2term = "0.3"
qrcode = "0.14"
rand = "0.10"
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
serde_repr = "0.1"
sha2 = "0.11"
tempfile = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time"] }
wecom = { path = "../wecom", default-features = false }
wecom-transport = { path = "../wecom-transport" }

[dev-dependencies]
aes-gcm = "0.11"
assert_cmd = "2"
assert-json-diff = "2"
base64 = "0.23"
mockito = "1"
predicates = "3"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wecom = { path = "../wecom" }
wiremock = "0.6"

[[test]]
name = "e2e"
path = "test-e2e/run.rs"
